services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: ekover-namenode
    environment:
      CLUSTER_NAME: ekover
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - ekover-network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: ekover-datanode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - ekover-network

  backend:
    build:
      context: ./ekover_starter
      dockerfile: backend/Dockerfile
    container_name: ekover-backend
    environment:
      STORAGE_BACKEND: hdfs
      HDFS_NAMENODE_URL: http://namenode:9870
      HDFS_ROOT: /ekover
      MAX_UPLOAD_SIZE: 26214400
    ports:
      - "8000:8000"
    volumes:
      - ./ekover_starter/data:/app/data
    depends_on:
      - namenode
      - datanode
    networks:
      - ekover-network

volumes:
  hadoop_namenode:
  hadoop_datanode:

networks:
  ekover-network:
    driver: bridge
